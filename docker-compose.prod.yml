services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:-https://app.tvacollect.com}
        ADMIN_URL: ${ADMIN_URL:-https://admin.tvacollect.com}
        PUBLIC_URL: ${PUBLIC_URL:-https://tvacollect.com}
        APP_HOST: ${APP_HOST:-app.tvacollect.com}
        ADMIN_HOST: ${ADMIN_HOST:-admin.tvacollect.com}
        PUBLIC_HOST: ${PUBLIC_HOST:-tvacollect.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app.tvacollect.com}
    container_name: tvacollect-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UPLOAD_STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    container_name: tvacollect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Exposed publicly so Trigger.dev's cloud-hosted tasks (source-leads,
    # draft-first-contact, etc. — see trigger/) can reach the database; they
    # run outside this Docker network entirely. Safe ONLY because those tasks
    # authenticate as a separate, least-privilege role scoped to the Lead and
    # LeadMessage tables (see docs/trigger-db-role.sql) — never this
    # POSTGRES_USER superuser, which stays internal-only. Do not point
    # DATABASE_URL in the Trigger.dev dashboard at this POSTGRES_USER.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tvacollect-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Console is reverse-proxied at a different public hostname than the
      # container sees itself on; MinIO needs this to build correct redirect
      # and asset URLs for the console UI. See docs/vps-docker-minio-deployment.md.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://minio.tvacollect.com}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    ports:
      # Loopback-only fallback console access via SSH tunnel. Not reachable
      # from the internet. The public route is minio.tvacollect.com via the
      # nginx service below, which reaches this container over the internal
      # Docker network (http://minio:9001) — this port mapping is unrelated
      # to that path and can be removed if the SSH tunnel fallback is unwanted.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/ready || wget -q -O - http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tvacollect-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::'$$S3_BUCKET'\",\"arn:aws:s3:::'$$S3_BUCKET'/*\"]}]}' > /tmp/tvacollect-app-policy.json &&
      mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY || true &&
      mc admin policy create local tvacollect-app /tmp/tvacollect-app-policy.json || true &&
      mc admin policy attach local tvacollect-app --user $$S3_ACCESS_KEY &&
      mc anonymous set none local/$$S3_BUCKET
      "

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: tvacollect-whatsapp-bridge
    restart: unless-stopped
    environment:
      PORT: 8088
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN}
      APP_WEBHOOK_URL: https://${APP_HOST:-app.tvacollect.com}/api/whatsapp/inbound
      WHATSAPP_AUTH_DIR: /app/auth_session
    volumes:
      # Persists the linked-device session so a redeploy or VPS reboot
      # doesn't force re-scanning the WhatsApp pairing QR code every time.
      - whatsapp-auth:/app/auth_session
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: tvacollect-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/tvacollect.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      # Basic-auth credentials for minio.tvacollect.com. Not checked into git;
      # generate it before starting/reloading nginx (docs/vps-docker-minio-deployment.md).
      - ./deploy/nginx/minio.htpasswd:/etc/nginx/minio.htpasswd:ro

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: tvacollect-certbot
    profiles:
      - certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d app.tvacollect.com
      -d admin.tvacollect.com
      -d tvacollect.com
      -d www.tvacollect.com
      -d minio.tvacollect.com
      -d whatsapp-bridge.tvacollect.com

volumes:
  postgres-data:
  minio-data:
  whatsapp-auth:
