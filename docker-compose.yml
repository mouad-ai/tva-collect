services:
  postgres:
    image: postgres:16-alpine
    container_name: tvacollect-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvacollect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tvacollect-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tvacollect-minio-admin
      MINIO_ROOT_PASSWORD: tvacollect-minio-root-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tvacollect-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tvacollect-minio-admin tvacollect-minio-root-secret; do sleep 2; done &&
      mc mb --ignore-existing local/tvacollect-uploads &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::tvacollect-uploads\",\"arn:aws:s3:::tvacollect-uploads/*\"]}]}' > /tmp/tvacollect-app-policy.json &&
      mc admin user add local tvacollect-app tvacollect-app-secret || true &&
      mc admin policy create local tvacollect-app /tmp/tvacollect-app-policy.json || true &&
      mc admin policy attach local tvacollect-app --user tvacollect-app &&
      mc anonymous set none local/tvacollect-uploads
      "

volumes:
  postgres-data:
  minio-data:
