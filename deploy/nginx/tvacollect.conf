upstream tvacollect_app {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name tvacollect.com www.tvacollect.com app.tvacollect.com admin.tvacollect.com minio.tvacollect.com whatsapp-bridge.tvacollect.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name tvacollect.com www.tvacollect.com app.tvacollect.com admin.tvacollect.com;

  ssl_certificate /etc/letsencrypt/live/app.tvacollect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.tvacollect.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location /_next/static/ {
    proxy_pass http://tvacollect_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Next.js owns routing, API routes, server actions, and redirects.
  # Do not add an SPA index.html fallback here; proxy every request to Next.
  location / {
    proxy_pass http://tvacollect_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }
}

# MinIO Console — SaaS admin only. Not linked from the app, not meant for
# clients or cabinets. Two layers are required to reach it:
#   1) HTTP Basic Auth below (deploy/nginx/minio.htpasswd, generated per environment).
#   2) The MinIO root credentials themselves (MinIO's own login screen).
# Add Cloudflare Access in front of this hostname for a third layer — see
# docs/vps-docker-minio-deployment.md.
#
# IMPORTANT: nginx refuses to start if deploy/nginx/minio.htpasswd is missing.
# Create that file BEFORE reloading nginx with this config (see the docs above).
server {
  listen 443 ssl http2;
  server_name minio.tvacollect.com;

  ssl_certificate /etc/letsencrypt/live/app.tvacollect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.tvacollect.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  auth_basic "TVA Collect admin only";
  auth_basic_user_file /etc/nginx/minio.htpasswd;

  # The console UI streams large object uploads/downloads through 9001 too.
  client_max_body_size 0;
  proxy_buffering off;
  proxy_request_buffering off;

  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://minio:9001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Nginx's own Basic Auth challenge is satisfied by this point (auth_basic
    # above already validated it) — do not also forward it to MinIO. MinIO's
    # console inspects the Authorization header for its own session/API auth,
    # and a stray Basic-auth value there makes /api/v1/session and the object
    # manager WebSocket return 401 even after a successful console login.
    proxy_set_header Authorization "";
  }
}

# WhatsApp bridge — internal API only, never opened in a browser. Auth is the
# WHATSAPP_BRIDGE_TOKEN header checked inside the service itself (see
# whatsapp-bridge/src/index.ts); this must be public HTTPS (not just on the
# Docker network) because Trigger.dev's tasks run on Trigger.dev's own cloud
# infrastructure, not on this VPS, and need to reach it over the internet.
# Hardening option for later: add an nginx auth_basic layer here too (same
# pattern as the minio.tvacollect.com block above) or put this hostname
# behind Cloudflare Access.
server {
  listen 443 ssl http2;
  server_name whatsapp-bridge.tvacollect.com;

  ssl_certificate /etc/letsencrypt/live/app.tvacollect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.tvacollect.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    proxy_pass http://whatsapp-bridge:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
  }
}
