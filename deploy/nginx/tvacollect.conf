upstream tvacollect_app {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name app.tvacollect.com tvacollect.com www.tvacollect.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name app.tvacollect.com;

  ssl_certificate /etc/letsencrypt/live/app.tvacollect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.tvacollect.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Next.js owns routing, API routes, server actions, and redirects.
  # Do not add an SPA index.html fallback here; proxy every request to Next.
  location / {
    proxy_pass http://tvacollect_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }
}

server {
  listen 443 ssl http2;
  server_name tvacollect.com www.tvacollect.com;

  ssl_certificate /etc/letsencrypt/live/app.tvacollect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.tvacollect.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://app.tvacollect.com$request_uri;
}
