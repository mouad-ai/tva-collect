server {
  listen 80;
  server_name app.tvacollect.com tvacollect.com www.tvacollect.com minio.tvacollect.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 200 "TVA Collect certificate bootstrap is ready.\n";
    add_header Content-Type text/plain;
  }
}
